<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wreklyn Shift | Where Chaos Gets Corrected</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="apple-touch-icon" href="./logo.png">
  <meta name="theme-color" content="#030712">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-950 text-slate-100 min-h-screen flex flex-col font-sans pb-24 selection:bg-emerald-500 selection:text-black">

  <!-- TOP HEADER -->
  <header class="bg-gray-900/90 backdrop-blur-md border-b border-emerald-950 px-4 py-3 sticky top-0 z-50 flex items-center justify-between shadow-lg">
    <div class="flex items-center gap-3">
      <img src="./logo.png" onerror="this.onerror=null; this.src='https://placehold.co/80x80/042f2e/10b981?text=WS';" alt="Logo" class="w-10 h-10 rounded-xl object-contain bg-black border border-emerald-500/30 p-0.5 shadow-md shadow-emerald-950/50" />
      <div>
        <h1 class="font-black text-base tracking-tight text-white leading-none">
          WREKLYN <span class="text-emerald-400">SHIFT</span>
        </h1>
        <p class="text-[10px] text-emerald-500/90 font-medium tracking-wide italic mt-0.5">Where chaos gets corrected</p>
      </div>
    </div>
    <span id="networkBadge" class="text-[11px] bg-red-950/80 text-red-300 border border-red-800 px-2.5 py-1 rounded-full font-mono font-bold">
      Connecting...
    </span>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 p-4 max-w-md mx-auto w-full space-y-4">

    <!-- STORE FILTER -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-3 shadow-sm">
      <label class="text-[11px] font-bold text-gray-400 uppercase tracking-wider block mb-1">Store Filter</label>
      <select id="locationFilter" onchange="loadShifts(); loadMessages();" class="w-full bg-black border border-gray-700 text-sm rounded-lg p-2.5 text-gray-200 focus:outline-none focus:border-emerald-500">
        <option value="ALL">All Network Locations</option>
      </select>
    </div>

    <!-- 4-WAY NAVIGATION TABS -->
    <div class="grid grid-cols-4 gap-1 bg-gray-900 p-1 rounded-xl border border-gray-800 text-center">
      <button type="button" onclick="switchTab('open')" id="tab-open" class="py-2 text-[11px] font-bold rounded-lg bg-emerald-500 text-black transition">Board</button>
      <button type="button" onclick="switchTab('post')" id="tab-post" class="py-2 text-[11px] font-bold rounded-lg text-gray-400 transition">Broadcast</button>
      <button type="button" onclick="switchTab('chat')" id="tab-chat" class="py-2 text-[11px] font-bold rounded-lg text-gray-400 transition">Chat & Feed</button>
      <button type="button" onclick="switchTab('stores')" id="tab-stores" class="py-2 text-[11px] font-bold rounded-lg text-gray-400 transition">Stores</button>
    </div>

    <!-- VIEW 1: OPEN SHIFTS -->
    <section id="view-open" class="space-y-3">
      <div id="shiftsList" class="space-y-3">
        <div class="text-center py-8 text-gray-500 text-sm">Loading available shifts...</div>
      </div>
    </section>

    <!-- VIEW 2: BROADCAST SHIFT -->
    <section id="view-post" class="hidden space-y-3 bg-gray-900 p-4 rounded-xl border border-gray-800">
      <div class="border-b border-gray-800 pb-2">
        <h2 class="font-bold text-sm text-white">Broadcast Unwanted Shift</h2>
        <p class="text-xs text-gray-400">Pushes coverage alert to available staff.</p>
      </div>
      <div class="space-y-3 pt-1">
        <div>
          <label class="text-xs font-medium text-gray-300">Store</label>
          <select id="postLocation" class="w-full bg-black border border-gray-700 rounded-lg p-2.5 text-sm text-gray-200 mt-1 focus:border-emerald-500"></select>
        </div>
        <div>
          <label class="text-xs font-medium text-gray-300">Date</label>
          <input type="date" id="postDate" class="w-full bg-black border border-gray-700 rounded-lg p-2.5 text-sm text-gray-200 mt-1 focus:border-emerald-500" />
        </div>
        <div>
          <label class="text-xs font-medium text-gray-300">Shift Block</label>
          <select id="postBlock" class="w-full bg-black border border-gray-700 rounded-lg p-2.5 text-sm text-gray-200 mt-1 focus:border-emerald-500">
            <option value="AM">Morning (9:00 AM - 3:00 PM)</option>
            <option value="MID">Mid-Day (12:00 PM - 6:00 PM)</option>
            <option value="PM">Evening (3:00 PM - 9:00 PM)</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-medium text-gray-300">Notes / Duties</label>
          <textarea id="postNotes" rows="2" placeholder="e.g. Register close, inventory count..." class="w-full bg-black border border-gray-700 rounded-lg p-2.5 text-sm text-gray-200 mt-1 focus:border-emerald-500"></textarea>
        </div>
        <button type="button" onclick="postShift()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-black py-3 rounded-xl text-sm transition shadow-lg shadow-emerald-950">
          Post Shift to Network
        </button>
      </div>
    </section>

    <!-- VIEW 3: TEAM CHAT & FEED -->
    <section id="view-chat" class="hidden space-y-3">
      <!-- Identity Setup -->
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-3 flex items-center gap-2">
        <label class="text-[10px] uppercase font-bold text-gray-400 shrink-0">Your Name:</label>
        <input type="text" id="chatSenderName" placeholder="e.g. Alex" oninput="localStorage.setItem('ws_user', this.value); loadMessages();" class="flex-1 bg-black border border-gray-700 rounded-lg px-2.5 py-1 text-xs text-emerald-400 font-bold focus:border-emerald-500 focus:outline-none" />
      </div>

      <!-- Mode Selector -->
      <div class="flex bg-black p-1 rounded-xl border border-gray-800">
        <button type="button" onclick="setChatMode('feed')" id="chat-mode-feed" class="flex-1 py-1.5 text-xs font-bold rounded-lg bg-gray-800 text-white transition">Store Feed</button>
        <button type="button" onclick="setChatMode('private')" id="chat-mode-private" class="flex-1 py-1.5 text-xs font-bold rounded-lg text-gray-400 transition">Private Messages</button>
      </div>

      <!-- Recipient Filter for PMs -->
      <div id="privateRecipientField" class="hidden bg-gray-900 border border-emerald-950 p-2.5 rounded-xl space-y-1">
        <label class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider block">Send To Staff Member:</label>
        <input type="text" id="chatRecipient" placeholder="Recipient's Name (e.g. Sam)" class="w-full bg-black border border-gray-700 rounded-lg p-2 text-xs text-white focus:border-emerald-500" />
      </div>

      <!-- Message Stream -->
      <div id="chatStream" class="space-y-2.5 min-h-[220px] max-h-[360px] overflow-y-auto bg-black/50 p-3 rounded-2xl border border-gray-800/80">
        <div class="text-center py-6 text-xs text-gray-500">No messages yet.</div>
      </div>

      <!-- Composer Input -->
      <div class="flex gap-2">
        <input type="text" id="chatInput" placeholder="Type a message or announcement..." onkeydown="if(event.key==='Enter') sendMessage();" class="flex-1 bg-black border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none" />
        <button type="button" onclick="sendMessage()" class="bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold px-4 py-2 rounded-xl text-xs transition">
          Send
        </button>
      </div>
    </section>

    <!-- VIEW 4: STORES DIRECTORY & CREATOR -->
    <section id="view-stores" class="hidden space-y-4">
      <div id="storeList" class="space-y-2"></div>

      <div class="bg-gray-900 border border-emerald-500/30 p-4 rounded-2xl space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="font-bold text-sm text-white">Add New Store Location</h3>
          <span class="text-[10px] bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded font-mono font-bold">Admin</span>
        </div>
        <input type="text" id="newStoreName" placeholder="Store Name" class="w-full bg-black border border-gray-700 rounded-lg p-2.5 text-xs text-white focus:border-emerald-500" />
        <input type="text" id="newStoreNumber" placeholder="Store ID (e.g. STORE-04)" class="w-full bg-black border border-gray-700 rounded-lg p-2.5 text-xs text-white focus:border-emerald-500" />
        <input type="text" id="newStoreAddress" placeholder="Full Street Address" class="w-full bg-black border border-gray-700 rounded-lg p-2.5 text-xs text-white focus:border-emerald-500" />
        <button type="button" onclick="saveNewStore()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold py-2.5 rounded-xl text-xs transition shadow-md shadow-emerald-950">
          + Save Location
        </button>
      </div>
    </section>

  </main>

  <!-- WREKLYN FOOTER -->
  <footer class="text-center py-6 text-[10px] text-gray-600 font-mono tracking-widest mt-auto border-t border-gray-900">
    A WREKLYN PRODUCT SYSTEM • ALL RIGHTS RESERVED
  </footer>

  <script>
    const SUPABASE_URL = "https://kwriljaflulqytkdfnkx.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_5tSC2mhg8UAWHQXXStgQdg_PcJtJn4A";

    let client = null;
    let locations = [];
    let currentChatMode = 'feed'; // 'feed' or 'private'

    function switchTab(tab) {
      ['open', 'post', 'chat', 'stores'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = 'py-2 text-[11px] font-bold rounded-lg text-gray-400 transition';
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'py-2 text-[11px] font-bold rounded-lg bg-emerald-500 text-black transition shadow-sm';
      if (tab === 'chat') loadMessages();
    }

    function setChatMode(mode) {
      currentChatMode = mode;
      const feedBtn = document.getElementById('chat-mode-feed');
      const privBtn = document.getElementById('chat-mode-private');
      const recField = document.getElementById('privateRecipientField');

      if (mode === 'feed') {
        feedBtn.className = 'flex-1 py-1.5 text-xs font-bold rounded-lg bg-gray-800 text-white transition';
        privBtn.className = 'flex-1 py-1.5 text-xs font-bold rounded-lg text-gray-400 transition';
        recField.classList.add('hidden');
      } else {
        feedBtn.className = 'flex-1 py-1.5 text-xs font-bold rounded-lg text-gray-400 transition';
        privBtn.className = 'flex-1 py-1.5 text-xs font-bold rounded-lg bg-emerald-600 text-white transition';
        recField.classList.remove('hidden');
      }
      loadMessages();
    }

    async function init() {
      try {
        if (typeof lucide !== 'undefined') lucide.createIcons();
        
        // Restore cached user name
        const savedUser = localStorage.getItem('ws_user') || 'Staff';
        document.getElementById('chatSenderName').value = savedUser;

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW failed', err));
        }

        const cleanUrl = SUPABASE_URL.replace(/\/+$/, '');
        client = supabase.createClient(cleanUrl, SUPABASE_ANON_KEY);

        // Listen for incoming live chat messages in realtime
        client.channel('realtime_messages')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'team_messages' }, () => {
            loadMessages();
          })
          .subscribe();

        await fetchLocations();
        await loadShifts();
      } catch (err) {
        console.error("Init Error:", err);
      }
    }

    async function fetchLocations() {
      if (!client) return;
      try {
        const { data, error } = await client.from('locations').select('*');
        if (error) throw error;

        locations = data || [];
        const filterEl = document.getElementById('locationFilter');
        const postEl = document.getElementById('postLocation');
        const listEl = document.getElementById('storeList');
        const badgeEl = document.getElementById('networkBadge');

        badgeEl.textContent = locations.length + ' Stores Live';
        badgeEl.className = 'text-[11px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2.5 py-1 rounded-full font-mono font-bold';

        filterEl.innerHTML = '<option value="ALL">All Network Locations</option>';
        postEl.innerHTML = '';
        listEl.innerHTML = '';

        locations.forEach(loc => {
          filterEl.innerHTML += `<option value="${loc.id}">${loc.name}</option>`;
          postEl.innerHTML += `<option value="${loc.id}">${loc.name}</option>`;
          listEl.innerHTML += `
            <div class="bg-gray-900 border border-gray-800 p-3.5 rounded-xl flex justify-between items-center">
              <div>
                <div class="font-bold text-sm text-white">${loc.name}</div>
                <div class="text-xs text-gray-400 mt-0.5">${loc.address}</div>
              </div>
              <span class="text-[10px] text-emerald-400 bg-emerald-950 border border-emerald-800 px-2 py-1 rounded font-mono font-bold">${loc.store_number}</span>
            </div>`;
        });
      } catch (e) {
        console.error(e);
      }
    }

    async function loadShifts() {
      if (!client) return;
      try {
        const filterId = document.getElementById('locationFilter').value;
        let query = client.from('shifts').select('*, locations(name, address)').eq('status', 'open_broadcast');
        if (filterId !== 'ALL') query = query.eq('location_id', filterId);

        const { data: shifts } = await query;
        const listEl = document.getElementById('shiftsList');

        if (!shifts || shifts.length === 0) {
          listEl.innerHTML = '<div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 text-center text-gray-400 text-sm"><i data-lucide="shield-check" class="w-10 h-10 text-emerald-500 mx-auto mb-2 opacity-90"></i>All shifts currently covered across network!</div>';
          lucide.createIcons();
          return;
        }

        listEl.innerHTML = shifts.map(s => `
          <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 space-y-3 shadow-md">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-[11px] font-black text-emerald-300 bg-emerald-950 border border-emerald-800 px-2.5 py-0.5 rounded-full uppercase tracking-wider">${s.shift_type} • 6 HOURS</span>
                <h3 class="font-bold text-white text-base mt-2">${s.locations?.name || 'Store'}</h3>
                <p class="text-xs text-gray-400">${s.locations?.address || ''}</p>
              </div>
              <span class="text-xs font-mono text-emerald-400 font-bold bg-black px-2 py-1 rounded border border-gray-800">${s.shift_date}</span>
            </div>
            ${s.notes ? `<p class="text-xs bg-black p-2.5 rounded-lg text-gray-300 border border-gray-800 italic">"${s.notes}"</p>` : ''}
            <button type="button" onclick="claimShift('${s.id}')" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold py-2.5 rounded-xl text-xs transition">Claim Shift (Submit to Manager)</button>
          </div>
        `).join('');
        lucide.createIcons();
      } catch (e) {
        console.error(e);
      }
    }

    async function loadMessages() {
      if (!client) return;
      const currentUser = document.getElementById('chatSenderName').value.trim().toLowerCase();
      let query = client.from('team_messages').select('*').order('created_at', { ascending: true });

      if (currentChatMode === 'feed') {
        query = query.eq('message_type', 'feed');
      } else {
        query = query.eq('message_type', 'private');
      }

      const { data: messages } = await query;
      const streamEl = document.getElementById('chatStream');

      if (!messages || messages.length === 0) {
        streamEl.innerHTML = `<div class="text-center py-8 text-xs text-gray-500 font-mono">No ${currentChatMode === 'feed' ? 'feed posts' : 'private messages'} yet.</div>`;
        return;
      }

      // Filter DMs client-side so staff only see messages sent to or from them
      const visibleMsgs = currentChatMode === 'feed' 
        ? messages 
        : messages.filter(m => m.sender_name.toLowerCase() === currentUser || (m.recipient_name && m.recipient_name.toLowerCase() === currentUser));

      if (visibleMsgs.length === 0) {
        streamEl.innerHTML = `<div class="text-center py-8 text-xs text-gray-500 font-mono">No private messages for "${currentUser}".</div>`;
        return;
      }

      streamEl.innerHTML = visibleMsgs.map(m => {
        const isSelf = m.sender_name.toLowerCase() === currentUser;
        const time = new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        return `
          <div class="p-2.5 rounded-xl text-xs space-y-1 ${isSelf ? 'bg-emerald-950/60 border border-emerald-800/80 ml-6' : 'bg-gray-900 border border-gray-800 mr-6'}">
            <div class="flex justify-between items-center text-[10px] text-gray-400">
              <span class="font-bold ${isSelf ? 'text-emerald-400' : 'text-slate-300'}">${m.sender_name} ${m.recipient_name ? '➜ ' + m.recipient_name : ''}</span>
              <span class="font-mono text-[9px] text-gray-500">${time}</span>
            </div>
            <p class="text-slate-200">${m.content}</p>
          </div>
        `;
      }).join('');

      streamEl.scrollTop = streamEl.scrollHeight;
    }

    async function sendMessage() {
      if (!client) return;
      const sender = document.getElementById('chatSenderName').value.trim();
      const content = document.getElementById('chatInput').value.trim();
      const recipient = document.getElementById('chatRecipient').value.trim();
      const locationId = document.getElementById('locationFilter').value;

      if (!sender) return alert('Please enter your name first');
      if (!content) return;
      if (currentChatMode === 'private' && !recipient) return alert('Please enter the recipient staff name for direct message');

      const { error } = await client.from('team_messages').insert([{
        sender_name: sender,
        recipient_name: currentChatMode === 'private' ? recipient : null,
        message_type: currentChatMode,
        location_id: locationId !== 'ALL' ? locationId : null,
        content: content
      }]);

      if (error) {
        alert('Failed to send: ' + error.message);
      } else {
        document.getElementById('chatInput').value = '';
        loadMessages();
      }
    }

    async function postShift() {
      if (!client) return;
      const locId = document.getElementById('postLocation').value;
      const date = document.getElementById('postDate').value;
      const block = document.getElementById('postBlock').value;
      const notes = document.getElementById('postNotes').value;

      if (!locId) return alert('Please select a store location.');
      if (!date) return alert('Please pick a shift date.');

      const startHour = block === 'AM' ? 9 : (block === 'MID' ? 12 : 15);
      const endHour = startHour + 6;

      const { error } = await client.from('shifts').insert([{
        location_id: locId,
        shift_date: date,
        start_time: `${date}T${String(startHour).padStart(2, '0')}:00:00Z`,
        end_time: `${date}T${String(endHour).padStart(2, '0')}:00:00Z`,
        shift_type: block,
        status: 'open_broadcast',
        notes: notes
      }]);

      if (error) {
        alert('Error: ' + error.message);
      } else {
        alert('Shift broadcasted to the Wreklyn network!');
        switchTab('open');
        loadShifts();
      }
    }

    async function claimShift(shiftId) {
      if (!client) return;
      const { error } = await client.from('shifts').update({ status: 'swap_pending' }).eq('id', shiftId);
      if (error) {
        alert(error.message);
      } else {
        alert('Shift claim sent to Store Manager for final sign-off!');
        loadShifts();
      }
    }

    async function saveNewStore() {
      if (!client) return;
      const name = document.getElementById('newStoreName').value;
      const storeNum = document.getElementById('newStoreNumber').value;
      const address = document.getElementById('newStoreAddress').value;

      if (!name || !storeNum || !address) return alert('Please fill in all store fields');

      const { error } = await client.from('locations').insert([{
        name: name,
        store_number: storeNum,
        address: address,
        latitude: 44.85,
        longitude: -93.04
      }]);

      if (error) {
        alert('Error saving location: ' + error.message);
      } else {
        alert('Store location added to your network!');
        document.getElementById('newStoreName').value = '';
        document.getElementById('newStoreNumber').value = '';
        document.getElementById('newStoreAddress').value = '';
        fetchLocations();
      }
    }

    window.onload = init;
  </script>
</body>
</html>
